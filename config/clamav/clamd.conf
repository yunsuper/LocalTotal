# LocalTotal 전용 clamd 설정 — npm run dev 가 --config-file 로 이 파일을 읽는다
# DB 경로는 Apple Silicon Homebrew 기준 (Intel Mac: /usr/local/var/lib/clamav)
DatabaseDirectory /opt/homebrew/var/lib/clamav

# 내 컴퓨터에서만 접속 (외부 차단)
TCPSocket 3310
TCPAddr 127.0.0.1

# INSTREAM 으로 최대 200MB 파일까지 검사 (앱 설정 최대값과 맞춤)
StreamMaxLength 200M
MaxFileSize 200M
MaxScanSize 400M

Foreground yes
LogTime yes